[package]
name = "wry-xq-demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
tao = "0.37.1"
wry = "0.57.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
strip = true
